name: Hard Detect Windows Validation
on:
  push:
    branches:
      - feature/hard-detect-persistent-calibration
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build regression tests
        run: dotnet build tests/DriftLab.Tests -c Release -m:1
      - name: Run regression tests
        run: dotnet run --project tests/DriftLab.Tests -c Release --no-build
      - name: Publish Windows app
        run: dotnet publish src/DriftLab.Desktop -c Release -r win-x64 --self-contained true -m:1 -o dist/win-x64
      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path 'dist/win-x64/*' -DestinationPath 'DualSenseDriftLab_HardDetect_Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DualSenseDriftLab_HardDetect_Windows
          path: DualSenseDriftLab_HardDetect_Windows.zip
          if-no-files-found: error
      - name: Publish beta 4 only after successful verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/hard-detect-persistent-calibration'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.0-beta.4'
          $asset = 'DualSenseDriftLab_HardDetect_Windows.zip'
          $notes = @'
          DualSense Drift Lab - Beta 4 (experimental Hard Detect)

          Adds Rimuovi tremolio / Reduce tremor · Hard Detect, unfiltered 15-second resting-stick analysis before and after a guided calibration attempt, precision diagnostics for both sticks, and an expanded post-calibration verification gate.

          Restores original calibration and blocks permanent saving if the checks fail, tremor persists, or calibration parameters are unchanged. The existing Save to controller action requires explicit approval and verified reboot/readback.

          HARDWARE LIMITATION: This feature does not install an anti-tremor filter in the DualSense and cannot repair a worn stick. Permanent calibration parameters may persist to PS5, but actual controller and PS5 effectiveness is not hardware-tested. Keep a backup.
          '@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists; refusing to overwrite its assets."
            exit 1
          }
          gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'DualSense Drift Lab Beta 4 - Hard Detect' --notes $notes --prerelease
